[project]
name = "fundus_stitching_toolkit"
version = "0.1.0"
description = "A library for stitching together multiple fundus images"
dependencies = [
    "appdirs",
    "numpy",
    "opencv-python-headless",
    "pandas",
    "scikit-learn",
    "scikit-image",
    "plotly",
    "fundus-odmac-toolkit @ git+https://github.com/ClementPla/fundus-odmac-toolkit",
    "fundus-vessels-toolkit @ git+https://github.com/gabriel-lepetitaimon/fundus-vessels-toolkit@dev/experimental",
    "scipy",
    "tqdm",
    "timm",
    "wheel==0.43.0"
]
readme = "README.md"

[project.optional-dependencies]
dev = ["black", "ruff", "pre-commit"]

notebook = ["ipykernel", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/fundus_stitching_toolkit"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "RUF", "TCH"]
fixable = ["I", "RUF100", "TCH"]
fix = true

[tool.hatch.metadata]
allow-direct-references = true